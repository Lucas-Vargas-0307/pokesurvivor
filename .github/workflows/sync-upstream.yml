name: Sync Upstream

on:
  schedule:
    # Runs automatically once every 12 hours (at 00:00 and 12:00 UTC)
    - cron: '0 0,12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure Git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Fetch and Merge Upstream
        run: |
          git remote add upstream https://github.com/JPTER78/pokesurvivor.git || git remote set-url upstream https://github.com/JPTER78/pokesurvivor.git
          git fetch upstream main

          UPSTREAM_REV=$(git rev-parse upstream/main)
          MERGE_BASE=$(git merge-base HEAD upstream/main)

          if [ "$UPSTREAM_REV" = "$MERGE_BASE" ]; then
            echo "Already up to date with upstream/main."
            exit 0
          fi

          echo "New updates found in upstream. Merging..."
          git merge upstream/main -m "Merge upstream updates from JPTER78/pokesurvivor"

      - name: Rebuild distribution
        run: |
          node tools/build.js

      - name: Run verification tests
        run: |
          node --test tests/net.test.cjs
          node --test tests/*.test.cjs

      - name: Commit build changes and push
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "build: rebuild distribution after upstream sync"
          fi
          git push origin main
